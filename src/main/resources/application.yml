server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: job-tracking-system
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  datasource:
    url: jdbc:mysql://localhost:3306/job_tracking_db
    username: jobtracker
    password: jobtracker123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

app:
  demo-data:
    # Seeds a demo account whose password is published in this repository.
    # Never enable this on a deployment other people can reach.
    enabled: ${DEMO_DATA_ENABLED:false}

  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: ${JWT_EXPIRATION:2592000000} # 30 days (in milliseconds)

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.nolcox.jobtracking: DEBUG
    org.springframework.security: DEBUG